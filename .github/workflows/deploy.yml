name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/muhsin097/resume-rag-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The box only pulls the image GitHub just built and pushed -- no
      # compiling happens on it, so the running API isn't starved of
      # CPU/RAM by its own deploy the way an on-box `docker compose build`
      # used to starve it.
      - name: SSH and redeploy api
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/resume-rag-api
            git pull
            cd deploy

            # 2026-10-24 outage: the box's disk filled up from accumulated
            # image layers/build cache across many deploys, `docker compose
            # pull` degraded silently, and the container kept running a
            # 16-hour-old image for most of a day while this workflow kept
            # reporting success. Guard against a repeat: proactively reclaim
            # space up front, and refuse to deploy (failing this job loudly)
            # if there still isn't enough room, rather than attempting a
            # cramped pull and hoping for the best.
            MIN_FREE_KB=2097152 # 2GB
            FREE_KB=$(df --output=avail / | tail -1 | tr -d ' ')
            if [ "$FREE_KB" -lt "$MIN_FREE_KB" ]; then
              echo "Low disk space ($((FREE_KB / 1024))MB free) -- pruning old Docker images/cache before deploying."
              docker image prune -af --filter 'until=24h' || true
              docker builder prune -af || true
              FREE_KB=$(df --output=avail / | tail -1 | tr -d ' ')
            fi
            if [ "$FREE_KB" -lt "$MIN_FREE_KB" ]; then
              echo "::error::Only $((FREE_KB / 1024))MB free after pruning -- refusing to deploy. Free up disk space on the box manually."
              exit 1
            fi

            docker compose pull api
            docker compose up -d

            # Verify the live service actually responds post-deploy, rather
            # than trusting `up -d`'s own exit code -- the api container
            # isn't on a published host port (only reachable through caddy),
            # so this hits the real public endpoint, same as healthcheck.yml.
            # (An earlier version of this check compared local image IDs
            # instead; that produced a false positive on a no-op deploy --
            # multi-arch manifest IDs don't compare cleanly, and compose
            # correctly left an unchanged container running rather than a
            # bug -- so it's a live HTTP check instead.)
            DEPLOY_OK=
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 10 "https://api.ceasetoresume.online/health" > /dev/null; then
                DEPLOY_OK=1
                break
              fi
              echo "Health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ -z "$DEPLOY_OK" ]; then
              echo "::error::API did not respond to /health after deploy -- check logs on the box."
              exit 1
            fi
            echo "Deploy verified: /health responded after deploy."
