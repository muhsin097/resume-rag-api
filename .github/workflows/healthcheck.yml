name: Health check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /login over HTTPS
        run: |
          curl -fsS --max-time 10 "https://ceasetoresume.online/login" > /dev/null
          echo "App is responding"
