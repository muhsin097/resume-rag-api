# Lives at resume-rag-api/deploy/docker-compose.yml. Assumes resume-rag-web
# and resume-rag-admin are both cloned as siblings of resume-rag-api (same
# parent directory). `api` is reached over the compose network at
# http://api:3000, so it never needs a public port. `web`/`admin` aren't
# publicly exposed either -- only `caddy` (80/443) is, reverse-proxying
# both by hostname (see Caddyfile).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumerag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: resumerag
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ..
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /resume-rag/api
        awslogs-create-group: "true"
        awslogs-stream: api
    environment:
      DATABASE_URL: postgresql://resumerag:${DB_PASSWORD}@postgres:5432/resumerag?schema=public
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: https://ceasetoresume.online
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_EMBEDDING_MODEL: voyage-3-lite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      FREE_GENERATIONS_LIMIT: "5"
      RECRUITER_FREE_CREDITS_LIMIT: "3"
    depends_on:
      - postgres

  web:
    build: ../../resume-rag-web
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /resume-rag/web
        awslogs-create-group: "true"
        awslogs-stream: web
    environment:
      RESUME_API_BASE_URL: http://api:3000
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://ceasetoresume.online
    depends_on:
      - api

  admin:
    build: ../../resume-rag-admin
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /resume-rag/admin
        awslogs-create-group: "true"
        awslogs-stream: admin
    environment:
      RESUME_API_BASE_URL: http://api:3000
      AUTH_SECRET: ${ADMIN_AUTH_SECRET}
      AUTH_URL: https://admin.ceasetoresume.online
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin

volumes:
  pgdata:
  caddy_data:
  caddy_config:
