# Lives at resume-rag-api/deploy/docker-compose.yml. `web` and `admin` now
# run on Vercel (see ceasetoresume.online / admin.ceasetoresume.online) --
# this box only runs the API, its database, and Caddy (which exposes the
# API publicly on api.ceasetoresume.online for the Vercel-hosted frontends
# to call).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumerag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: resumerag
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    # Built on GitHub Actions' own runner and pushed to GHCR -- deploys do
    # `docker compose pull` (a lightweight download) instead of compiling
    # on this box, so a deploy no longer starves the live API of CPU/RAM
    # while it builds. `build: ..` is kept so local dev can still run
    # `docker compose up --build` from source.
    image: ghcr.io/muhsin097/resume-rag-api:latest
    build: ..
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /resume-rag/api
        awslogs-create-group: "true"
        awslogs-stream: api
    environment:
      DATABASE_URL: postgresql://resumerag:${DB_PASSWORD}@postgres:5432/resumerag?schema=public
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: https://ceasetoresume.online
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_EMBEDDING_MODEL: voyage-3-lite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      FREE_GENERATIONS_LIMIT: "5"
      RECRUITER_FREE_CREDITS_LIMIT: "3"
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    depends_on:
      - postgres

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
